name: Build PersonalDocumentTool APK

on:
  push:
    branches:
      - main
    paths:
      - 'PersonalDocumentTool_latest.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version
          adb version

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Extract Android project
        run: |
          set -eu

          ZIP_FILE="PersonalDocumentTool_latest.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE tidak ditemukan."
            echo "Pastikan ZIP tersedia di root repository."
            exit 1
          fi

          mkdir -p project
          unzip -oq "$ZIP_FILE" -d project

          echo "=== File project yang ditemukan ==="
          find project -maxdepth 5 -type f \
            \( -name gradlew \
            -o -name settings.gradle \
            -o -name settings.gradle.kts \
            -o -name build.gradle \
            -o -name build.gradle.kts \) \
            -print

      - name: Locate Gradle project
        run: |
          set -eu

          GRADLEW="$(find "$GITHUB_WORKSPACE/project" \
            -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: File gradlew tidak ditemukan."
            echo "Struktur direktori project:"
            find "$GITHUB_WORKSPACE/project" \
              -maxdepth 6 -type d -print
            exit 1
          fi

          GRADLE_DIR="$(dirname "$GRADLEW")"

          if [ ! -f "$GRADLE_DIR/settings.gradle.kts" ] && \
             [ ! -f "$GRADLE_DIR/settings.gradle" ]; then
            echo "ERROR: File settings.gradle(.kts) tidak ditemukan."
            echo "Lokasi gradlew: $GRADLEW"
            exit 1
          fi

          echo "GRADLE_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"

          echo "=== Lokasi project Gradle ==="
          echo "$GRADLE_DIR"

          echo "=== Isi folder project ==="
          ls -la "$GRADLE_DIR"

      - name: Prepare Gradle
        run: |
          set -eu

          cd "$GRADLE_DIR"
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build debug APK
        run: |
          set -eu

          cd "$GRADLE_DIR"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Find APK
        run: |
          set -eu

          echo "=== Mencari APK ==="

          find "$GRADLE_DIR" \
            -type f \
            -path '*/build/outputs/apk/*' \
            -name '*.apk' \
            -print

          if ! find "$GRADLE_DIR" \
            -type f \
            -path '*/build/outputs/apk/*' \
            -name '*.apk' | grep -q .; then
            echo "ERROR: Build selesai tetapi APK tidak ditemukan."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonalDocumentTool-debug-apk
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
