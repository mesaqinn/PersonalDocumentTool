name: Build PersonalDocumentTool APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version
          adb version

            - name: Locate Gradle project
        run: |
          echo "=== Mencari Gradle Wrapper ==="

          find . -maxdepth 7 \
            -type f \
            \( -name gradlew \
            -o -name settings.gradle.kts \
            -o -name settings.gradle \) \
            -print

          echo "=== Struktur direktori ==="
          find . -maxdepth 3 -type d -print

      - name: Prepare Gradle
        run: ./gradlew --version

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Find APK
        run: |
          echo "APK yang berhasil dibuat:"
          find . -type f -path '*/build/outputs/apk/*' \
            -name '*.apk' -print

          if ! find . -type f \
            -path '*/build/outputs/apk/*' \
            -name '*.apk' | grep -q .; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonalDocumentTool-debug-apk
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
          retention-days: 14
