name: Build PersonalDocumentTool APK

on:
  push:
    branches:
      - main
    paths:
      - 'PersonalDocumentTool_latest.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Verify Android SDK
        run: |
          set -eu
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version
          adb version

      - name: Extract Android project
        run: |
          set -eu

          ZIP_FILE="$GITHUB_WORKSPACE/PersonalDocumentTool_latest.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: PersonalDocumentTool_latest.zip tidak ditemukan."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/project"
          unzip -oq "$ZIP_FILE" -d "$GITHUB_WORKSPACE/project"

          echo "=== Struktur project ==="
          find "$GITHUB_WORKSPACE/project" \
            -maxdepth 5 -type f \
            \( -name gradlew \
            -o -name gradlew.bat \
            -o -name settings.gradle \
            -o -name settings.gradle.kts \
            -o -name gradle-wrapper.jar \
            -o -name gradle-wrapper.properties \
            -o -name build.gradle \
            -o -name build.gradle.kts \) \
            -print

      - name: Locate Gradle project
        id: locate
        run: |
          set -eu

          ROOT="$GITHUB_WORKSPACE/project"

          echo "=== Mencari Gradle Wrapper ==="

          GRADLEW="$(find "$ROOT" \
            -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: File gradlew tidak tersedia di ZIP."
            echo "Memeriksa keberadaan wrapper dan konfigurasi Gradle..."

            find "$ROOT" -type f \
              \( -name 'gradle-wrapper.jar' \
              -o -name 'gradle-wrapper.properties' \
              -o -name 'settings.gradle' \
              -o -name 'settings.gradle.kts' \
              -o -name 'build.gradle' \
              -o -name 'build.gradle.kts' \) \
              -print

            echo "Perlu memperbaiki atau menyediakan Gradle Wrapper."
            exit 1
          fi

          DIR="$(dirname "$GRADLEW")"

          if [ ! -f "$DIR/settings.gradle" ] && \
             [ ! -f "$DIR/settings.gradle.kts" ]; then
            echo "ERROR: File settings.gradle(.kts) tidak ditemukan."
            echo "Lokasi wrapper: $GRADLEW"
            exit 1
          fi

          chmod +x "$GRADLEW"

          echo "GRADLE_DIR=$DIR" >> "$GITHUB_ENV"

          echo "=== Project ditemukan ==="
          echo "Direktori: $DIR"
          ls -la "$DIR"

      - name: Prepare Gradle
        run: |
          set -eu
          cd "$GRADLE_DIR"
          ./gradlew --version

      - name: Build debug APK
        run: |
          set -eu
          cd "$GRADLE_DIR"
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Find APK
        run: |
          set -eu

          echo "=== Mencari APK ==="

          find "$GRADLE_DIR" \
            -type f \
            -path '*/build/outputs/apk/*' \
            -name '*.apk' \
            -print

          if ! find "$GRADLE_DIR" \
            -type f \
            -path '*/build/outputs/apk/*' \
            -name '*.apk' | grep -q .; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonalDocumentTool-debug-apk
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
