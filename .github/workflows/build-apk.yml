name: BUILD DEBUG APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Personal Document Tool
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Check source ZIP
        shell: bash
        run: |
          set -eu

          ZIP_FILE="PersonalDocumentTool_v0.2.0_source.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP versi 0.2.0 tidak ditemukan."
            echo "File ZIP yang tersedia:"
            find . -maxdepth 2 -type f -name '*.zip'
            exit 1
          fi

          unzip -t "$ZIP_FILE"

      - name: Extract Android project
        shell: bash
        run: |
          set -eu

          mkdir -p extracted_project
          unzip -oq PersonalDocumentTool_v0.2.0_source.zip \
            -d extracted_project

          ROOT="$(pwd)/extracted_project"

          SETTINGS_FILE="$(find "$ROOT" -type f \
            -name 'settings.gradle.kts' -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE="$(find "$ROOT" -type f \
              -name 'settings.gradle' -print -quit)"
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: File settings Gradle tidak ditemukan."
            find "$ROOT" -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Konfigurasi Gradle aplikasi tidak ditemukan."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Proyek ditemukan:"
          echo "$PROJECT_DIR"

          echo "Versi aplikasi:"
          grep -E 'versionCode|versionName|compileSdk|minSdk|targetSdk' \
            "$PROJECT_DIR/app/build.gradle.kts"

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -eu

          cd "$PROJECT_DIR"

          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "ERROR: gradle-wrapper.properties tidak ditemukan."
            exit 1
          fi

          if [ ! -f gradlew ] || \
             [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then

            echo "Menyiapkan Gradle 8.11.1..."

            curl -fsSL \
              https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
              -o /tmp/gradle-8.11.1-bin.zip

            mkdir -p /tmp/gradle-distribution

            unzip -oq /tmp/gradle-8.11.1-bin.zip \
              -d /tmp/gradle-distribution

            /tmp/gradle-distribution/gradle-8.11.1/bin/gradle wrapper \
              --gradle-version 8.11.1 \
              --distribution-type bin
          fi

          chmod +x gradlew

          echo "Gradle wrapper siap."

      - name: Validate Android configuration
        shell: bash
        run: |
          set -eu

          cd "$PROJECT_DIR"

          echo "Memeriksa konfigurasi Java dan Kotlin..."

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          text = p.read_text()

          if "com.android.application" not in text:
              raise SystemExit("Plugin Android tidak ditemukan.")

          if "org.jetbrains.kotlin.android" not in text:
              raise SystemExit("Plugin Kotlin Android tidak ditemukan.")

          if not re.search(r'compileSdk\s*=\s*35', text):
              print("Peringatan: compileSdk tidak menggunakan versi 35.")

          print("File konfigurasi ditemukan dan plugin utama tersedia.")
          print("Konfigurasi sumber tidak diubah otomatis.")
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -eu

          cd "$PROJECT_DIR"

          java -version

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -eu

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            find "$PROJECT_DIR/app/build/outputs" -type f || true
            exit 1
          fi

          echo "APK berhasil dibuat:"
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PersonalDocumentTool-v0.2.0-debug
          path: extracted_project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
