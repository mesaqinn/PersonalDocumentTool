name: BUILD DEBUG APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Personal Document Tool
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -eu

          ZIP=""

          for candidate in \
            "PersonalDocumentTool_v0.2.1_source_fixed.zip" \
            "PersonalDocumentTool_v0.2.0_source.zip" \
            "PersonalDocumentTool_latest.zip"; do
            if [ -f "$candidate" ]; then
              ZIP="$candidate"
              break
            fi
          done

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP sumber proyek tidak ditemukan."
            ls -la
            exit 1
          fi

          echo "Menggunakan sumber: $ZIP"

          unzip -t "$ZIP"
          mkdir -p extracted_project
          unzip -oq "$ZIP" -d extracted_project

          ROOT="$(pwd)/extracted_project"

          SETTINGS="$(find "$ROOT" -type f \
            -name 'settings.gradle.kts' -print -quit)"

          if [ -z "$SETTINGS" ]; then
            SETTINGS="$(find "$ROOT" -type f \
              -name 'settings.gradle' -print -quit)"
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: File settings Gradle tidak ditemukan."
            find "$ROOT" -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts tidak ditemukan."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Proyek ditemukan: $PROJECT_DIR"

      - name: Fix Compose import and JVM targets
        shell: bash
        run: |
          set -eu
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          # Perbaiki impor SelectionContainer.
          main = Path(
              "app/src/main/kotlin/com/esa/personaldocumenttool/MainActivity.kt"
          )

          if not main.exists():
              matches = list(
                  Path("app/src/main").rglob("MainActivity.kt")
              )
              if not matches:
                  raise SystemExit("ERROR: MainActivity.kt tidak ditemukan.")
              main = matches[0]

          source = main.read_text()
          source = source.replace(
              "import androidx.compose.foundation.text.SelectionContainer",
              "import androidx.compose.foundation.text.selection.SelectionContainer"
          )

          if "SelectionContainer" in source and not re.search(
              r"(?m)^import androidx\.compose\.foundation\.text\.selection\.SelectionContainer\s*$",
              source
          ):
              source = re.sub(
                  r"(?m)^import androidx\.compose\.foundation\.text(?:\.selection)?\.SelectionContainer\s*$\n?",
                  "",
                  source
              )
              source = source.replace(
                  "package com.esa.personaldocumenttool",
                  "package com.esa.personaldocumenttool\n\n"
                  "import androidx.compose.foundation.text.selection.SelectionContainer",
                  1
              )

          main.write_text(source)
          print("Impor SelectionContainer diperiksa:", main)

          # Samakan target Java dan Kotlin ke versi 17.
          gradle = Path("app/build.gradle.kts")
          text = gradle.read_text()

          if not re.search(r"(?m)^android\s*\{", text):
              raise SystemExit("ERROR: Blok android tidak ditemukan.")

          text = re.sub(
              r"JavaVersion\.VERSION_1_8",
              "JavaVersion.VERSION_17",
              text
          )

          text = re.sub(
              r'jvmTarget\s*=\s*["\'](?:1\.8|8)["\']',
              'jvmTarget = "17"',
              text
          )

          if not re.search(r"\bcompileOptions\s*\{", text):
              text = re.sub(
                  r"(?m)^android\s*\{",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }""",
                  text,
                  count=1
              )

          if not re.search(r"\bkotlinOptions\s*\{", text):
              text = re.sub(
                  r"(?m)^android\s*\{",
                  """android {
              kotlinOptions {
                  jvmTarget = "17"
              }""",
                  text,
                  count=1
              )

          gradle.write_text(text)
          print("Target Java/Kotlin telah disesuaikan ke 17.")
          PY

      - name: Prepare Gradle
        shell: bash
        run: |
          set -eu
          cd "$PROJECT_DIR"

          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "ERROR: gradle-wrapper.properties tidak ditemukan."
            exit 1
          fi

          if [ ! -f gradlew ] || \
             [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then

            curl -fsSL \
              https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
              -o /tmp/gradle.zip

            mkdir -p /tmp/gradle-dist
            unzip -oq /tmp/gradle.zip -d /tmp/gradle-dist

            /tmp/gradle-dist/gradle-8.11.1/bin/gradle wrapper \
              --gradle-version 8.11.1 \
              --distribution-type bin
          fi

          chmod +x gradlew

      - name: Build debug APK
        shell: bash
        run: |
          set -eu
          cd "$PROJECT_DIR"

          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -eu

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            find "$PROJECT_DIR/app/build/outputs" -type f || true
            exit 1
          fi

          ls -lh "$APK"
          echo "APK berhasil dibuat."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PersonalDocumentTool-debug-apk
          path: extracted_project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
