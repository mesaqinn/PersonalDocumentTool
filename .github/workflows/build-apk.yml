name: Build PersonalDocumentTool APK

on:
  push:
    branches:
      - main
    paths:
      - 'PersonalDocumentTool_latest.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          set -eu
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          set -eu

          ZIP="$GITHUB_WORKSPACE/PersonalDocumentTool_latest.zip"

          test -f "$ZIP" || {
            echo "ERROR: ZIP project tidak ditemukan."
            exit 1
          }

          mkdir -p "$GITHUB_WORKSPACE/project"
          unzip -oq "$ZIP" -d "$GITHUB_WORKSPACE/project"

          find "$GITHUB_WORKSPACE/project" \
            -type f \
            -name settings.gradle.kts -o -name settings.gradle \
            -print

      - name: Locate Gradle project
        run: |
          set -eu

          ROOT="$GITHUB_WORKSPACE/project"

          SETTINGS="$(find "$ROOT" -type f \
            -name settings.gradle.kts -o -name settings.gradle \
            -print -quit)"

          test -n "$SETTINGS" || {
            echo "ERROR: settings.gradle tidak ditemukan."
            exit 1
          }

          DIR="$(dirname "$SETTINGS")"

          test -f "$DIR/build.gradle.kts" -o \
               -f "$DIR/build.gradle" || {
            echo "ERROR: build.gradle tidak ditemukan."
            exit 1
          }

          echo "GRADLE_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project: $DIR"
          ls -la "$DIR"

      - name: Prepare Gradle Wrapper
        run: |
          set -eu
          cd "$GRADLE_DIR"

          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "ERROR: gradle-wrapper.properties tidak ditemukan."
            exit 1
          fi

          if [ ! -f ./gradlew ] || \
             [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle Wrapper tidak lengkap."
            echo "Menggunakan Gradle 8.11.1 untuk membuat Wrapper."

            sudo apt-get update
            sudo apt-get install -y gradle

            # Jalankan Gradle sistem untuk membuat Wrapper
            gradle wrapper --gradle-version 8.11.1
          fi

          chmod +x ./gradlew

          echo "=== Versi Gradle Wrapper ==="
          ./gradlew --version

      - name: Fix Java and Kotlin JVM targets
        run: |
          set -eu

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["GRADLE_DIR"])
          app_file = root / "app" / "build.gradle.kts"

          if not app_file.is_file():
              raise SystemExit(
                  f"ERROR: File tidak ditemukan: {app_file}"
              )

          text = app_file.read_text(encoding="utf-8")

          # Perbarui target Java lama, jika ada.
          text = re.sub(
              r'(?m)^(\s*sourceCompatibility\s*=\s*)JavaVersion\.VERSION_1_8\s*$',
              r'\1JavaVersion.VERSION_17',
              text
          )

          text = re.sub(
              r'(?m)^(\s*targetCompatibility\s*=\s*)JavaVersion\.VERSION_1_8\s*$',
              r'\1JavaVersion.VERSION_17',
              text
          )

          # Pastikan blok compileOptions tersedia dan menggunakan Java 17.
          if not re.search(r'\bcompileOptions\s*\{', text):
              match = re.search(r'\bandroid\s*\{', text)
              if not match:
                  raise SystemExit("ERROR: Blok android tidak ditemukan.")

              text = (
                  text[:match.end()]
                  + """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

          """
                  + text[match.end():]
              )
          else:
              match = re.search(r'\bcompileOptions\s*\{', text)
              opening = text.find("{", match.start())
              depth = 1
              pos = opening + 1

              while pos < len(text) and depth:
                  if text[pos] == "{":
                      depth += 1
                  elif text[pos] == "}
