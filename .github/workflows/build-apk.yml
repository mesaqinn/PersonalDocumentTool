name: BUILD DEBUG APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -eu

          ZIP_FILE="PersonalDocumentTool_latest.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE tidak ditemukan di root repository."
            echo "Daftar file repository:"
            ls -la
            exit 1
          fi

          unzip -t "$ZIP_FILE"
          mkdir -p extracted_project
          unzip -oq "$ZIP_FILE" -d extracted_project

          ROOT="$(pwd)/extracted_project"

          SETTINGS_FILE="$(find "$ROOT" -type f -name 'settings.gradle.kts' -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE="$(find "$ROOT" -type f -name 'settings.gradle' -print -quit)"
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts atau settings.gradle tidak ditemukan."
            find "$ROOT" -maxdepth 5 -type f -print
            exit 1
          fi

          GRADLE_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -d "$GRADLE_DIR/app" ]; then
            echo "ERROR: Folder app tidak ditemukan di $GRADLE_DIR"
            exit 1
          fi

          echo "GRADLE_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"
          echo "Proyek Android ditemukan: $GRADLE_DIR"
          ls -la "$GRADLE_DIR"

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -eu
          cd "$GRADLE_DIR"

          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: gradle-wrapper.properties tidak ditemukan."
            exit 1
          fi

          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Wrapper tidak lengkap. Menyiapkan Gradle 8.11.1."

            curl -fsSL \
              https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
              -o /tmp/gradle-8.11.1-bin.zip

            mkdir -p /tmp/gradle-dist
            unzip -oq /tmp/gradle-8.11.1-bin.zip -d /tmp/gradle-dist

            /tmp/gradle-dist/gradle-8.11.1/bin/gradle wrapper \
              --gradle-version 8.11.1 \
              --distribution-type bin
          fi

          chmod +x gradlew

      - name: Fix Java and Kotlin JVM targets
        shell: bash
        run: |
          set -eu

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(os.environ["GRADLE_DIR"])
          build_file = root / "app" / "build.gradle.kts"

          if not build_file.is_file():
              raise SystemExit(f"ERROR: File tidak ditemukan: {build_file}")

          text = build_file.read_text()

          # Hapus konfigurasi target lama jika ada.
          text = re.sub(
              r'JavaVersion\.VERSION_1_8',
              'JavaVersion.VERSION_17',
              text
          )

          # Pastikan compileOptions berada di dalam blok android.
          if not re.search(r'\bcompileOptions\s*\{', text):
              match = re.search(r'(?m)^android\s*\{', text)
              if not match:
                  raise SystemExit("ERROR: Blok android tidak ditemukan.")

              insert_at = match.end()
              block = """
              
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              """
              text = text[:insert_at] + block + text[insert_at:]
          else:
              text = re.sub(
                  r'(?m)^\s*sourceCompatibility\s*=\s*JavaVersion\.VERSION_1_8\s*$',
                  '        sourceCompatibility = JavaVersion.VERSION_17',
                  text
              )
              text = re.sub(
                  r'(?m)^\s*targetCompatibility\s*=\s*JavaVersion\.VERSION_1_8\s*$',
                  '        targetCompatibility = JavaVersion.VERSION_17',
                  text
              )

          # Pastikan Kotlin menggunakan JVM 17.
          if not re.search(r'\bkotlinOptions\s*\{', text):
              match = re.search(r'(?m)^android\s*\{', text)
              if not match:
                  raise SystemExit("ERROR: Blok android tidak ditemukan.")

              insert_at = match.end()
              block = """
              
              kotlinOptions {
                  jvmTarget = "17"
              }
              """
              text = text[:insert_at] + block + text[insert_at:]
          else:
              text = re.sub(
                  r'(?m)jvmTarget\s*=\s*["\']1\.8["\']',
                  'jvmTarget = "17"',
                  text
              )

          build_file.write_text(text)
          print(f"Konfigurasi target diperbarui: {build_file}")
          print("Target Java dan Kotlin: 17")
          PY

          echo "Memeriksa konfigurasi hasil perubahan:"
          sed -n '1,100p' "$GRADLE_DIR/app/build.gradle.kts"

      - name: Build debug APK
        shell: bash
        run: |
          set -eu
          cd "$GRADLE_DIR"
          java -version
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -eu

          APK="$(find "$GRADLE_DIR/app/build/outputs/apk/debug" \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan setelah proses build."
            exit 1
          fi

          echo "APK berhasil dibuat: $APK"
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PersonalDocumentTool-debug-apk
          path: extracted_project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
