name: BUILD DEBUG APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Personal Document Tool
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -eu

          ZIP="PersonalDocumentTool_v0.2.0_source.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP sumber versi 0.2.0 tidak ditemukan."
            exit 1
          fi

          unzip -t "$ZIP"
          mkdir -p extracted_project
          unzip -oq "$ZIP" -d extracted_project

          ROOT="$(pwd)/extracted_project"

          SETTINGS="$(find "$ROOT" -type f \
            -name 'settings.gradle.kts' -print -quit)"

          if [ -z "$SETTINGS" ]; then
            SETTINGS="$(find "$ROOT" -type f \
              -name 'settings.gradle' -print -quit)"
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: File settings Gradle tidak ditemukan."
            find "$ROOT" -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts tidak ditemukan."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Proyek ditemukan: $PROJECT_DIR"

      - name: Prepare Gradle
        shell: bash
        run: |
          set -eu
          cd "$PROJECT_DIR"

          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "ERROR: gradle-wrapper.properties tidak ditemukan."
            exit 1
          fi

          if [ ! -f gradlew ] || \
             [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then

            curl -fsSL \
              https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
              -o /tmp/gradle.zip

            mkdir -p /tmp/gradle-dist
            unzip -oq /tmp/gradle.zip -d /tmp/gradle-dist

            /tmp/gradle-dist/gradle-8.11.1/bin/gradle wrapper \
              --gradle-version 8.11.1 \
              --distribution-type bin
          fi

          chmod +x gradlew

      - name: Fix Java and Kotlin targets
        shell: bash
        run: |
          set -eu
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          text = p.read_text()

          if not re.search(r'(?m)^android\s*\{', text):
              raise SystemExit("ERROR: Blok android tidak ditemukan.")

          # Pastikan konfigurasi Java dan Kotlin berada
          # di dalam blok android, bukan di luarnya.
          if not re.search(r'\bcompileOptions\s*\{', text):
              text = re.sub(
                  r'(?m)^android\s*\{',
                  '''android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }''',
                  text,
                  count=1
              )

          if not re.search(r'\bkotlinOptions\s*\{', text):
              text = re.sub(
                  r'(?m)^android\s*\{',
                  '''android {
              kotlinOptions {
                  jvmTarget = "17"
              }''',
                  text,
                  count=1
              )

          # Samakan target Java yang sudah ada.
          text = re.sub(
              r'JavaVersion\.VERSION_1_8',
              'JavaVersion.VERSION_17',
              text
          )

          # Samakan target Kotlin yang sudah ada.
          text = re.sub(
              r'jvmTarget\s*=\s*["\'](?:1\.8|8)["\']',
              'jvmTarget = "17"',
              text
          )

          p.write_text(text)

          print("Konfigurasi target Java/Kotlin telah diperbarui.")
          print(text)
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -eu
          cd "$PROJECT_DIR"

          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -eu

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            find "$PROJECT_DIR/app/build/outputs" -type f || true
            exit 1
          fi

          ls -lh "$APK"
          echo "APK berhasil dibuat."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PersonalDocumentTool-v0.2.0-debug
          path: extracted_project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
